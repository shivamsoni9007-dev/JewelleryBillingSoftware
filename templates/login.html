<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Shree Ram Kumar Jewellers</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #f6ecd8, #e8d6b5);
        }

        .login-box {
            width: 420px;
            max-width: 92%;
            background: #fffdf7;
            border: 2px solid #d0aa50;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 18px 45px rgba(0, 0, 0, 0.18);
        }

        .login-header {
            text-align: center;
            padding: 24px 20px;
            background: linear-gradient(135deg, #4d050b, #7b101a, #981d27);
            border-bottom: 4px solid #d4ad51;
            color: white;
        }

        .ram-line {
            font-family: Georgia, serif;
            font-size: 13px;
            font-weight: bold;
            color: #f0cf72;
            margin-bottom: 8px;
        }

        .logo {
            width: 95px;
            height: 78px;
            object-fit: contain;
            background: #fffaf0;
            border: 1px solid #dfbd65;
            border-radius: 8px;
            padding: 4px;
        }

        .shop-name {
            margin: 10px 0 3px;
            font-family: Georgia, "Times New Roman", serif;
            font-size: 27px;
            color: #fff2cf;
        }

        .established {
            font-size: 10px;
            color: #edcb70;
            font-weight: bold;
        }

        .shop-details {
            margin-top: 8px;
            font-size: 10px;
            line-height: 1.6;
            color: #fff4db;
        }

        .login-body {
            padding: 28px;
        }

        .login-title {
            text-align: center;
            margin: 0 0 20px;
            color: #781019;
            font-family: Georgia, serif;
            font-size: 23px;
        }

        .field {
            margin-bottom: 15px;
        }

        .field label {
            display: block;
            margin-bottom: 6px;
            font-size: 12px;
            font-weight: bold;
            color: #684628;
        }

        .field input {
            width: 100%;
            padding: 12px 13px;
            border: 1px solid #d5b775;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
        }

        .field input:focus {
            border-color: #7b101a;
            box-shadow: 0 0 0 3px rgba(123, 16, 26, 0.08);
        }

        .error {
            margin-bottom: 15px;
            padding: 10px 12px;
            border-radius: 6px;
            background: #fff0f0;
            border: 1px solid #e7a6a6;
            color: #a10c18;
            font-size: 12px;
            text-align: center;
        }

        .login-btn {
            width: 100%;
            padding: 12px;
            margin-top: 5px;
            border: none;
            border-radius: 6px;
            background: #7b101a;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .login-btn:hover {
            background: #5b0911;
        }

        .footer {
            margin-top: 18px;
            text-align: center;
            font-size: 11px;
            color: #876634;
        }

        .secure-text {
            margin-top: 5px;
            font-size: 10px;
            color: #999;
        }
    </style>
</head>

<body>

<div class="login-box">

    <div class="login-header">

        <div class="ram-line">
            || जय श्री राम ||
        </div>

        <img
            class="logo"
            src="{{ url_for('static', filename='images/shop-logo.png') }}"
            alt="Shop Logo"
        >

        <h1 class="shop-name">
            श्री राम कुमार ज्वेलर्स
        </h1>

        <div class="established">
            ESTABLISHED 1992
        </div>

        <div class="shop-details">
            Harraipur Alamchand, Kaushambi
            <br>
            ☎ 9935850807 &nbsp; | &nbsp; 9935256605
        </div>

    </div>

    <div class="login-body">

        <h2 class="login-title">
            Software Login
        </h2>

        {% if error %}
        <div class="error">
            {{ error }}
        </div>
        {% endif %}

        <form method="POST">

            <div class="field">
                <label>Username</label>

                <input
                    type="text"
                    name="username"
                    placeholder="Enter username"
                    autocomplete="username"
                    required
                >
            </div>

            <div class="field">
                <label>Password</label>

                <input
                    type="password"
                    name="password"
                    placeholder="Enter password"
                    autocomplete="current-password"
                    required
                >
            </div>

            <button
                type="submit"
                class="login-btn"
            >
                🔐 Login
            </button>

        </form>

        <div class="footer">
            Shree Ram Kumar Jewellers

            <div class="secure-text">
                Secure Jewellery Billing Management System
            </div>
        </div>

    </div>

</div>

</body>
</html>
